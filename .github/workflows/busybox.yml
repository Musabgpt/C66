name: MusabAI — BusyBox Android build
on:
  push:
    branches: ["feat/android-busybox"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  busybox:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Android NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || find "$ANDROID_HOME" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "ndk;27.2.12479018"
      - name: Build native Android BusyBox
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK="$ANDROID_HOME/ndk/27.2.12479018"
          bash android-lite/native/build_busybox.sh
      - name: Verify ELF and app integration
        run: python3 -m unittest connectors.test_busybox_integration -v
      - name: Upload cross-compiled BusyBox and corresponding source
        uses: actions/upload-artifact@v4
        with:
          name: MusabAI-BusyBox-Android
          path: |
            android-lite/app/src/main/jniLibs/arm64-v8a/libbusybox.so
            android-lite/app/src/main/jniLibs/x86_64/libbusybox.so
            android-lite/build/busybox-source/busybox-1.38.0.tar.bz2
            android-lite/native/build_busybox.sh
            android-lite/BUSYBOX.md
          retention-days: 30
